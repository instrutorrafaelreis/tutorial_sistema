<svg xmlns="http://www.w3.org/2000/svg" width="850" height="320" viewBox="0 0 850 320" font-family="Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="425" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">DIAGRAMA ENTIDADE-RELACIONAMENTO (DER) - OFICINA MECÂNICA</text>

  <!-- Tabela CLIENTE -->
  <g transform="translate(30, 60)">
    <rect width="210" height="190" fill="#f8f9fa" stroke="#1e293b" stroke-width="2"/>
    <rect width="210" height="35" fill="#1e293b"/>
    <text x="105" y="23" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">CLIENTE</text>
    <text x="15" y="60" font-size="13" fill="#0f172a" font-weight="bold">PK  id (INT)</text>
    <text x="15" y="85" font-size="13" fill="#334155">    nome (VARCHAR)</text>
    <text x="15" y="110" font-size="13" fill="#334155">    telefone (VARCHAR)</text>
    <text x="15" y="135" font-size="13" fill="#334155">    cpf (VARCHAR - Hash)</text>
    <text x="15" y="160" font-size="13" fill="#334155">    login (VARCHAR)</text>
    <text x="15" y="182" font-size="13" fill="#334155">    senha (VARCHAR - Hash)</text>
  </g>

  <!-- Relacionamento CLIENTE (1) -> (N) VEICULO -->
  <line x1="240" y1="130" x2="330" y2="130" stroke="#1e293b" stroke-width="2"/>
  <text x="250" y="122" font-size="13" font-weight="bold">1</text>
  <text x="310" y="122" font-size="13" font-weight="bold">N</text>

  <!-- Tabela VEICULO -->
  <g transform="translate(330, 60)">
    <rect width="200" height="150" fill="#f8f9fa" stroke="#1e293b" stroke-width="2"/>
    <rect width="200" height="35" fill="#1e293b"/>
    <text x="100" y="23" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">VEICULO</text>
    <text x="15" y="60" font-size="13" fill="#0f172a" font-weight="bold">PK  id (INT)</text>
    <text x="15" y="85" font-size="13" fill="#334155">    modelo (VARCHAR)</text>
    <text x="15" y="110" font-size="13" fill="#334155">    marca (VARCHAR)</text>
    <text x="15" y="135" font-size="13" fill="#0369a1" font-weight="bold">FK  cliente_id (INT)</text>
  </g>

  <!-- Relacionamento VEICULO (1) -> (N) AGENDAMENTO -->
  <line x1="530" y1="130" x2="620" y2="130" stroke="#1e293b" stroke-width="2"/>
  <text x="540" y="122" font-size="13" font-weight="bold">1</text>
  <text x="600" y="122" font-size="13" font-weight="bold">N</text>

  <!-- Tabela AGENDAMENTO -->
  <g transform="translate(620, 60)">
    <rect width="200" height="150" fill="#f8f9fa" stroke="#1e293b" stroke-width="2"/>
    <rect width="200" height="35" fill="#1e293b"/>
    <text x="100" y="23" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">AGENDAMENTO</text>
    <text x="15" y="60" font-size="13" fill="#0f172a" font-weight="bold">PK  id (INT)</text>
    <text x="15" y="85" font-size="13" fill="#334155">    data_agendamento (DATE)</text>
    <text x="15" y="110" font-size="13" fill="#334155">    servico (VARCHAR)</text>
    <text x="15" y="135" font-size="13" fill="#0369a1" font-weight="bold">FK  veiculo_id (INT)</text>
  </g>
</svg>
